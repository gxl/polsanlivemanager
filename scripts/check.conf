# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Generated by bootstrap (2026-10-19) for: .NET 10 (src/PolsanLive.slnx) + React/TS/Vite (web/).
# One step per line:  <name>: <command>   — runs in order, fails fast. [fast] in the NAME = fast profile.
#
# GREENFIELD GUARDS: each step runs only once its project exists and otherwise prints "skipped".
# The first feature that scaffolds src/PolsanLive.slnx or web/package.json removes the guard of
# the steps it enables (keep the command unchanged) — a guard must never hide a missing project
# once the code exists. Rerun ./scripts/residue (both profiles) when this file changes.
#
# Resource hygiene (docs/testing.md) — inventory and neutralisation:
# resource hygiene: no MSBuild node reuse (MSBUILDDISABLENODEREUSE=1, -nodeReuse:false)
# resource hygiene: no MSBuild server (DOTNET_CLI_USE_MSBUILD_SERVER=0)
# resource hygiene: no shared compiler server / VBCSCompiler (-p:UseSharedCompilation=false)
# resource hygiene: no watch mode (vitest run), e2e single-worker headless (--workers=1)
# resource hygiene: app-under-test owned and stopped by Playwright webServer (web/playwright.config.ts)
#
# Two speeds: the test split is a SELECTOR — Category=Unit (fast) vs Category!=Unit (full only),
# so every test runs in exactly one of them (docs/testing.md, Two speeds rule 4).

build [fast]: if [ -f src/PolsanLive.slnx ]; then MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_NOLOGO=1 dotnet build src/PolsanLive.slnx -c Release -nodeReuse:false -p:UseSharedCompilation=false; else echo "skipped: src/PolsanLive.slnx not scaffolded yet"; fi
format [fast]: if [ -f src/PolsanLive.slnx ]; then MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_NOLOGO=1 dotnet format src/PolsanLive.slnx --verify-no-changes --no-restore; else echo "skipped: src/PolsanLive.slnx not scaffolded yet"; fi
test-unit [fast]: if [ -f src/PolsanLive.slnx ]; then MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_NOLOGO=1 dotnet test src/PolsanLive.slnx -c Release --no-build --filter "Category=Unit"; else echo "skipped: src/PolsanLive.slnx not scaffolded yet"; fi
web-lint [fast]: if [ -f web/package.json ]; then cd web && npm ci --no-audit --no-fund && npm run lint && npx tsc --noEmit && npx prettier --check .; else echo "skipped: web/package.json not scaffolded yet"; fi
web-test [fast]: if [ -f web/package.json ]; then cd web && npx vitest run; else echo "skipped: web/package.json not scaffolded yet"; fi
test-integration: if [ -f src/PolsanLive.slnx ]; then MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_NOLOGO=1 dotnet test src/PolsanLive.slnx -c Release --no-build --filter "Category!=Unit"; else echo "skipped: src/PolsanLive.slnx not scaffolded yet"; fi
e2e: if [ -f web/playwright.config.ts ]; then cd web && npm run build && npx playwright test --workers=1; else echo "skipped: web/playwright.config.ts not scaffolded yet"; fi
audit: if [ -f src/PolsanLive.slnx ]; then out=$(DOTNET_NOLOGO=1 dotnet list src/PolsanLive.slnx package --vulnerable --include-transitive) || exit 1; echo "$out"; if echo "$out" | grep -q "has the following vulnerable packages"; then exit 1; fi; else echo "skipped: src/PolsanLive.slnx not scaffolded yet"; fi; if [ -f web/package.json ]; then cd web && npm audit --audit-level=high; fi
